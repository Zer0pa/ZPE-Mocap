[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zpe-mocap"
version = "0.1.0"
description = "Zero-label structural motion search and compression. ZPE-MoCap deterministic codec/search package."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Zer0pa (Pty) Ltd", email = "architects@zer0pa.ai" }]
license = "LicenseRef-Zer0pa-SAL-7.0"
dependencies = [
  "numpy>=1.24",
]
keywords = ["motion-capture", "skeletal-motion", "bvh", "motion-retrieval", "motion-search", "deterministic-codec"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
zpe-mocap = "zpe_mocap.cli:main"

[project.optional-dependencies]
cmu = ["bvhio"]
gates = ["comet_ml>=3.43", "zstandard>=0.22"]
dev = ["pytest", "build"]

[project.urls]
Homepage = "https://github.com/Zer0pa/ZPE-Mocap"
Documentation = "https://github.com/Zer0pa/ZPE-Mocap#readme"
Issues = "https://github.com/Zer0pa/ZPE-Mocap/issues"
Repository = "https://github.com/Zer0pa/ZPE-Mocap"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "code"

[tool.setuptools.packages.find]
where = ["code"]
include = ["zpe_mocap*"]
exclude = ["tests*"]
